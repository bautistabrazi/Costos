<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#315f72">
    <title>Organizador de gastos</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Control personal</p>
          <h1>Gastos</h1>
        </div>
        <div class="header-actions">
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="Cambiar tema">
            <span id="themeIcon" class="theme-icon">D</span>
            <span id="themeLabel">Oscuro</span>
          </button>
          <div class="month-picker">
            <label for="monthFilter">Mes</label>
            <input id="monthFilter" type="month">
          </div>
        </div>
      </header>

      <section id="authPanel" class="auth-panel">
        <div>
          <p class="eyebrow">Cuenta</p>
          <h2 id="authTitle">Conecta Supabase</h2>
          <p id="authMessage" class="auth-message">Configura Supabase para guardar tus gastos en la nube.</p>
        </div>
        <form id="authForm" class="auth-form">
          <label>Email
            <input name="email" type="email" autocomplete="email" placeholder="tu@email.com" required>
          </label>
          <button class="primary-action" type="submit">Enviar acceso</button>
        </form>
        <div id="sessionPanel" class="session-panel" hidden>
          <span id="userEmail"></span>
          <button id="signOutButton" class="ghost-action" type="button">Salir</button>
        </div>
      </section>

      <section class="hero-summary" aria-label="Resumen mensual">
        <article class="total-card">
          <span>Total estimado</span>
          <strong id="monthTotal">$0</strong>
          <small>Gastos diarios + tarjetas del mes</small>
        </article>

        <div class="summary-grid">
          <article class="summary-card">
            <span>Diarios</span>
            <strong id="dailyTotal">$0</strong>
          </article>
          <article class="summary-card">
            <span>Tarjetas</span>
            <strong id="cardsThisMonth">$0</strong>
          </article>
          <article class="summary-card">
            <span>Proximo mes</span>
            <strong id="nextMonthTotal">$0</strong>
          </article>
        </div>
      </section>

      <nav class="tabs" aria-label="Secciones">
        <button class="tab active" data-tab="daily" type="button">Gastos</button>
        <button class="tab" data-tab="cards" type="button">Tarjetas</button>
        <button class="tab" data-tab="projection" type="button">Proyeccion</button>
      </nav>

      <section id="daily" class="panel active">
        <form id="dailyForm" class="entry-form">
          <div class="form-row">
            <label>Fecha
              <input name="date" type="date" required>
            </label>
            <label>Monto
              <span class="money-input">
                <span>$</span>
                <input name="amount" type="text" inputmode="numeric" autocomplete="off" data-money placeholder="0" required>
              </span>
            </label>
          </div>
          <label>Descripcion
            <input name="description" type="text" maxlength="80" placeholder="Almuerzo, farmacia, taxi..." required>
          </label>
          <div class="form-row">
            <label>Categoria
              <select name="category" required>
                <option>Comida</option>
                <option>Transporte</option>
                <option>Supermercado</option>
                <option>Salud</option>
                <option>Servicios</option>
                <option>Ocio</option>
                <option>Otros</option>
              </select>
            </label>
            <label>Medio de pago
              <select name="paymentMethod" required>
                <option>Mercado Pago</option>
                <option>Banco Galicia</option>
                <option>Efectivo</option>
                <option>Transferencia</option>
                <option>Otro</option>
              </select>
            </label>
          </div>
          <button class="primary-action" type="submit">Agregar gasto</button>
        </form>

        <div class="section-heading">
          <h2>Gastos del mes</h2>
          <button id="clearDaily" class="ghost-action" type="button">Vaciar mes</button>
        </div>
        <div id="dailyList" class="list"></div>
      </section>

      <section id="cards" class="panel">
        <form id="newCardForm" class="entry-form compact-form">
          <div class="form-row">
            <label>Tarjeta
              <input name="name" type="text" maxlength="40" placeholder="Visa Galicia, Mastercard MP..." required>
            </label>
            <button class="primary-action inline-action" type="submit">Agregar tarjeta</button>
          </div>
        </form>

        <div id="cardPicker" class="card-picker"></div>
        <div id="selectedCardSummary" class="card-detail"></div>

        <form id="cardForm" class="entry-form">
          <div class="form-row">
            <label>Tarjeta destino
              <select name="cardId" required></select>
            </label>
            <label>Fecha de compra
              <input name="purchaseDate" type="date" required>
            </label>
          </div>
          <label>Compra
            <input name="purchase" type="text" maxlength="80" placeholder="Notebook, zapatillas, seguro..." required>
          </label>
          <div class="form-row">
            <label>Monto total
              <span class="money-input">
                <span>$</span>
                <input name="amount" type="text" inputmode="numeric" autocomplete="off" data-money placeholder="0" required>
              </span>
            </label>
            <label>Cuotas totales
              <input name="installments" type="number" min="1" step="1" inputmode="numeric" required>
            </label>
          </div>
          <div class="form-row">
            <label>Cuotas pagas
              <input name="paidInstallments" type="number" min="0" step="1" inputmode="numeric" value="0" required>
            </label>
            <label>Primer vencimiento
              <input name="firstDueMonth" type="month" required>
            </label>
          </div>
          <button class="primary-action" type="submit">Agregar compra</button>
        </form>

        <div class="section-heading">
          <h2>Proximo a pagar</h2>
          <span id="cardsCount" class="soft-label">0 compras activas</span>
        </div>
        <div id="cardList" class="list"></div>
      </section>

      <section id="projection" class="panel">
        <div class="section-heading">
          <h2>Proyeccion anual</h2>
          <span class="soft-label">Gastos diarios + cuotas</span>
        </div>
        <div id="projectionList" class="projection-list"></div>
      </section>
    </main>

    <template id="emptyState">
      <div class="empty-state">
        <strong>No hay movimientos todavia</strong>
        <span>Cuando cargues datos, el resumen se actualiza solo.</span>
      </div>
    </template>

    <script type="module" src="app.js"></script>
  </body>
</html>
